name: Rosavio isolated feature qualification
on:
  push:
    branches: [feature-rosenpfad-backup-20261113]
permissions:
  contents: read
concurrency:
  group: rosavio-feature-qualification
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build isolated Windows candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/cloud-build.ps1 -Force
      - name: Sign and qualify Windows candidate in twenty languages
        shell: pwsh
        env:
          ROSAVIO_UPDATE_KEY: ${{ secrets.ROSAVIO_UPDATE_KEY }}
          ROSAVIO_SIGNING_PASSWORD: ${{ secrets.ROSAVIO_SIGNING_PASSWORD }}
        run: ./scripts/cloud-build.ps1 -Phase Package
      - name: Retain candidate and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosavio-feature-windows-${{ github.run_id }}
          path: D:/rv/release/
          retention-days: 7
  linux-flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare free standard runner
        run: |
          test "$GITHUB_ACTIONS" = true && test "$GITHUB_REPOSITORY" = aheinen1971-cmd/rosavio
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y autoconf2.13 build-essential curl git nasm pkg-config libgtk-3-dev libdbus-glib-1-dev libxt-dev libasound2-dev libpulse-dev libdrm-dev libx11-xcb-dev libgl1-mesa-dev libnss3-tools python3-venv unzip zip xvfb flatpak flatpak-builder gnupg dbus-x11 desktop-file-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and test Linux candidate in twenty languages
        run: python scripts/cloud-unix-build.py --platform linux-x64
      - name: Verify signed Linux update and profile preservation
        env:
          ROSAVIO_UPDATE_KEY: ${{ secrets.ROSAVIO_UPDATE_KEY }}
          ROSAVIO_SIGNING_PASSWORD: ${{ secrets.ROSAVIO_SIGNING_PASSWORD }}
        run: python scripts/cloud-unix-sign-test.py linux-x64
      - name: Verify isolated signed Flatpak update using the tested native candidates
        env:
          GH_TOKEN: ${{ github.token }}
          ROSAVIO_FLATPAK_FROM_NATIVE_TEST: '1'
        run: dbus-run-session -- xvfb-run -a python scripts/build-flatpak-test.py
      - name: Retain candidates and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosavio-feature-linux-flatpak-${{ github.run_id }}
          path: |
            unix-results/
            flatpak-results/
            flatpak-profile-tests/*-report.json
            flatpak-profile-tests/locales/report.json
          retention-days: 7
