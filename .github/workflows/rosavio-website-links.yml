name: Rosavio verified website download links
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Rosavio automatic Windows release', 'Rosavio automatic Linux release', 'Rosavio automatic macOS release', 'Rosavio saved macOS package verification', 'Rosavio automatic Flatpak release', 'Rosavio public Flatpak installation and update trial']
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: rosavio-website-links
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'aheinen1971-cmd/rosavio' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Check release guards and preserve page content
        run: python3 -m unittest discover -s tests -p test_website_downloads.py
      - name: Select only fully tested regular releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-website-downloads.py
      - name: Save changed links and publish website with existing Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs; then
            echo 'No new verified downloads; nothing to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/*.html
          git commit -m 'Update website links to verified Rosavio releases'
          git push origin HEAD:main
          gh workflow run rosavio-pages.yml --ref main
