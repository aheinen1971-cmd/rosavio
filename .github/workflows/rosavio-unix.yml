name: Rosavio Linux and macOS native bring-up
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all only when no platform builds are active)
        type: choice
        default: all
        options: [all, linux-x64, macos-arm64, macos-x64]
permissions:
  contents: read
concurrency:
  group: rosavio-unix-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'aheinen1971-cmd/rosavio' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'linux-x64' && '{"include":[{"platform":"linux-x64","runner":"ubuntu-24.04"}]}' || inputs.platform == 'macos-arm64' && '{"include":[{"platform":"macos-arm64","runner":"macos-15"}]}' || inputs.platform == 'macos-x64' && '{"include":[{"platform":"macos-x64","runner":"macos-15-intel"}]}' || '{"include":[{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"macos-arm64","runner":"macos-15"},{"platform":"macos-x64","runner":"macos-15-intel"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare Linux dependencies and disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true && test "$GITHUB_REPOSITORY" = aheinen1971-cmd/rosavio
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y autoconf2.13 build-essential curl git libasound2-dev libdbus-glib-1-dev libgtk-3-dev libx11-xcb-dev libxt-dev nasm pkg-config python3-venv unzip zip xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork dependencies and inspect disk space
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          df -h
      - name: Full native build and twenty-language startup tests
        shell: bash
        run: python scripts/cloud-unix-build.py --platform '${{ matrix.platform }}'
      - name: Sign native MAR and test real update with restart
        shell: bash
        env:
          ROSAVIO_UPDATE_KEY: ${{ secrets.ROSAVIO_UPDATE_KEY }}
          ROSAVIO_SIGNING_PASSWORD: ${{ secrets.ROSAVIO_SIGNING_PASSWORD }}
        run: python scripts/cloud-unix-sign-test.py '${{ matrix.platform }}'
      - name: Retain platform test packages and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosavio-native-${{ matrix.platform }}-${{ github.run_id }}
          path: unix-results/${{ matrix.platform }}/
          retention-days: 7
          if-no-files-found: warn
