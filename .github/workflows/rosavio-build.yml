name: Rosavio automatic Windows release
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild current stable Firefox for an integration test
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * *'
      timezone: 'Europe/Berlin'
permissions:
  contents: read
concurrency:
  group: rosavio-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'aheinen1971-cmd/rosavio' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reserve release tag before the long build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROSAVIO_FORCE_BUILD: ${{ inputs.force }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Invoke-RestMethod 'https://product-details.mozilla.org/1.0/firefox_versions.json').LATEST_FIREFOX_VERSION
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw 'Invalid stable Firefox version' }
          $latest = gh release view --repo aheinen1971-cmd/rosavio --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read current release' }
          if ($env:ROSAVIO_FORCE_BUILD -ne 'true' -and $latest.tagName -like "v$version-rosavio.*") { exit 0 }
          $tag = "v$version-rosavio.$env:GITHUB_RUN_ID"
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if ($existing.object.sha -ne $env:GITHUB_SHA) { throw 'Reserved tag points to a different source commit' }
          } else {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot reserve source tag; stop before building' }
          }
      - name: Build German Rosavio from verified stable Firefox source
        id: compile
        shell: pwsh
        env:
          ROSAVIO_FORCE_BUILD: ${{ inputs.force }}
        run: ./scripts/cloud-build.ps1 -Force:($env:ROSAVIO_FORCE_BUILD -eq 'true')
      - name: Verify, sign and test native update
        if: steps.compile.outputs.built == 'true'
        id: package
        shell: pwsh
        env:
          ROSAVIO_UPDATE_KEY: ${{ secrets.ROSAVIO_UPDATE_KEY }}
          ROSAVIO_SIGNING_PASSWORD: ${{ secrets.ROSAVIO_SIGNING_PASSWORD }}
        run: ./scripts/cloud-build.ps1 -Phase Package
      - name: Publish and test public update with rollback on failure
        if: steps.package.outputs.built == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/cloud-publish.ps1


