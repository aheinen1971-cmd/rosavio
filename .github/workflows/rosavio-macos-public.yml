name: Rosavio macOS public signed update trial
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful sealed macOS repack run
        type: string
        required: true
      platform:
        description: Native platform
        type: choice
        options: [macos-arm64, macos-x64]
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: rosavio-macos-public-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  public-update:
    if: github.repository == 'aheinen1971-cmd/rosavio' && github.event.repository.private == false
    runs-on: ${{ inputs.platform == 'macos-arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require successful sealed source package and local update
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          source=os.environ['SOURCE_RUN']
          if not source.isdecimal():raise SystemExit('Invalid source run')
          r=json.loads(subprocess.check_output(['gh','api','repos/aheinen1971-cmd/rosavio/actions/runs/'+source]))
          if r['status']!='completed' or r['conclusion']!='success' or r['path']!='.github/workflows/rosavio-macos-repack.yml' or r['head_branch']!='main':raise SystemExit('Successful main macOS repack required')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: rosavio-macos-repack-${{ inputs.platform }}-${{ inputs.source_run }}
          path: macos-candidate
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Public native signed update and resource seal verification
        env:
          GH_TOKEN: ${{ github.token }}
          ROSAVIO_MAC_PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/publish-macos-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosavio-macos-public-${{ inputs.platform }}-${{ github.run_id }}
          path: |
            macos-candidate/release/*test.json
            macos-candidate/release/*.xml
            baseline-check/report.json
            candidate-check/report.json
            candidate-languages/report.json
          retention-days: 7
          if-no-files-found: warn
