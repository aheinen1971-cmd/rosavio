name: Rosavio public status table
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-status-dashboard.py', 'scripts/maintenance_http.py', '.github/workflows/rosavio-status.yml']
  schedule:
    # Refresh the existing schedule registration after missed schedule events.
    # Existing clock also checks missing regular Windows/Linux version checks.
    - cron: '11,41 * * * *'
  workflow_run:
    workflows: ['Rosavio automatic Windows release', 'Rosavio automatic Linux release', 'Rosavio automatic Flatpak release', 'Rosavio verified website download links', 'Rosavio website and signed Flatpak repository']
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: rosavio-status-data
  cancel-in-progress: false
jobs:
  status:
    if: github.repository == 'aheinen1971-cmd/rosavio' && github.event.repository.private == false && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      # Runs inside the existing status concurrency group. Release events always refresh.
      - name: Skip duplicate periodic status work
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.request
          refresh = True
          if os.environ['STATUS_EVENT'] in ('schedule', 'workflow_dispatch'):
              request = urllib.request.Request(
                  'https://api.github.com/repos/aheinen1971-cmd/rosavio/contents/status.json?ref=rosavio-status-data',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'rosavio-status-freshness'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('encoding') != 'base64':
                  raise ValueError('Invalid status encoding')
              snapshot = json.loads(base64.b64decode(payload['content']))
              checked = datetime.datetime.fromisoformat(snapshot['checkedAt'].replace('Z', '+00:00'))
              age = (datetime.datetime.now(datetime.timezone.utc) - checked).total_seconds()
              if age < -60:
                  raise ValueError('Status timestamp is in the future')
              refresh = age >= 25 * 60
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('refresh=' + str(refresh).lower(), file=output)
          print('Refresh public status' if refresh else 'Skip: public status is less than 25 minutes old')
          PY
      - name: Verify status classification
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          python3 -m unittest discover -s tests -p test_maintenance_http.py
          python3 -m unittest discover -s tests -p test_status_dashboard.py
      - name: Read public evidence and update only status data
        if: steps.freshness.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-status-dashboard.py --publish
  build-watchdog:
    needs: status
    if: always() && github.repository == 'aheinen1971-cmd/rosavio' && github.event.repository.private == false && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Verify recovery safeguards
        run: python3 -m unittest discover -s tests -p test_build_watchdog.py
      - name: Recover missing regular version checks once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-watchdog.py --apply
