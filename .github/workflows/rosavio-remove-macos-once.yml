name: Rosavio authorized legacy Mac cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rosavio-remove-macos-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,re
          def api(path,method='GET'):
           p=subprocess.run(['gh','api','--method',method,'repos/aheinen1971-cmd/rosavio/'+path],capture_output=True,text=True,check=True)
           return json.loads(p.stdout) if p.stdout.strip() else None
          deleted=[];kept=[]
          runs=api('actions/workflows/rosavio-unix.yml/runs?per_page=100')
          assert runs['total_count']<=100
          for r in runs['workflow_runs']:
           assert r['path']=='.github/workflows/rosavio-unix.yml'
           jobs=api('actions/runs/'+str(r['id'])+'/jobs?per_page=100')
           assert jobs['total_count']<=100
           names=[j['name'] for j in jobs['jobs']]
           if names and all(re.fullmatch(r'native \(macos-(arm64|x64), macos-15(-intel)?\)',n) for n in names):
            assert r['status']=='completed'
            api('actions/runs/'+str(r['id']),'DELETE');deleted.append(r['id'])
           else:kept.append({'id':r['id'],'jobs':names})
          print(json.dumps({'deleted':deleted,'retainedSharedOrLinux':kept,'passed':True}))
          
          PY
